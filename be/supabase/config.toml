# Các function này tự kiểm soát truy cập nên tắt bước kiểm tra JWT của gateway:
# giphy và error-report là endpoint công khai cho trình duyệt của khách (có
# giới hạn tần suất), còn telegram-bot xác thực bằng secret token của webhook.

[functions.giphy]
verify_jwt = false

[functions.telegram-bot]
verify_jwt = false

[functions.error-report]
verify_jwt = false
